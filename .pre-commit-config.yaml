repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        # sh -c: `pre-commit run --all-files` appends paths; `gitleaks git` only
        # allows one optional repo arg. protect --staged scans the index/worktree diff.
        entry: sh -c 'gitleaks protect --staged --verbose --redact=100'
        language: system
        pass_filenames: false
        always_run: true
